name: release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Unit tests
        run: cargo test --release

      - name: Build release binary
        run: cargo build --release

      - name: Static verification
        shell: pwsh
        run: ./scripts/verify.ps1 -StaticOnly

      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1

      - name: Check that the README matches the version
        shell: pwsh
        run: |
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          $match = Select-String -Path README.md -Pattern '\*\*v(\d+\.\d+\.\d+)\*\*'
          if (-not $match) { throw 'README.md is missing its **vX.Y.Z** line' }
          $readme = $match.Matches[0].Groups[1].Value
          if ($cargo -ne $readme) {
            throw "README says v$readme but Cargo.toml says $cargo - run scripts/set-version.ps1 $cargo"
          }
          Write-Host "README matches v$readme"

      - name: Check that the tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          if ($version -ne $tag) { throw "Cargo.toml says $version but the tag says $tag" }
          Write-Host "version $version matches the tag"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoSleep-win64
          path: dist/NoSleep-*.zip
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $zip = Get-ChildItem dist/NoSleep-*.zip | Select-Object -First 1
          $checksum = Get-Content dist/NoSleep/SHA256.txt

          # A constant asset name makes the /releases/latest/download/ URL stable
          # across versions, so a bookmark keeps working.
          $stable = Join-Path $zip.DirectoryName 'NoSleep-win64.zip'
          Copy-Item $zip.FullName $stable -Force

          $notes = @(
            'Portable Windows build (x64).',
            '',
            'Download the zip, extract it anywhere, and run `NoSleep.exe`.',
            'Nothing is installed, nothing is written, and deleting the executable is a complete removal.',
            '',
            '### Install with no SmartScreen prompt',
            '',
            'A browser download marks the file as untrusted, and Windows Explorer''s *Extract All* copies that mark onto the executable. PowerShell does neither:',
            '',
            '```powershell',
            '$d = "$env:LOCALAPPDATA\NoSleep"',
            'New-Item -ItemType Directory -Force $d | Out-Null',
            'Invoke-WebRequest https://github.com/cpmacatangay/nosleep/releases/latest/download/NoSleep-win64.zip -OutFile "$env:TEMP\NoSleep.zip"',
            'Expand-Archive "$env:TEMP\NoSleep.zip" -DestinationPath $d -Force',
            '& "$d\NoSleep.exe"',
            '```',
            '',
            'If you already extracted it, clear the mark instead:',
            '',
            '```powershell',
            'Unblock-File .\NoSleep.exe',
            '```',
            '',
            'Checksum:',
            '',
            '```',
            $checksum,
            '```'
          ) -join "`n"

          $notes | Set-Content -Path release-notes.md -Encoding UTF8
          gh release create $tag $stable --title "NoSleep $tag" --notes-file release-notes.md

name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Unit tests
        run: cargo test --release

      - name: Static verification
        shell: pwsh
        run: ./scripts/verify.ps1 -StaticOnly

      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1

      - name: Check that the tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          if ($version -ne $tag) { throw "Cargo.toml says $version but the tag says $tag" }
          Write-Host "version $version matches the tag"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoSleep-win64
          path: dist/NoSleep-*.zip
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $zip = Get-ChildItem dist/NoSleep-*.zip | Select-Object -First 1
          $checksum = Get-Content dist/NoSleep/SHA256.txt

          # A constant asset name makes the /releases/latest/download/ URL stable
          # across versions, so a bookmark keeps working.
          $stable = Join-Path $zip.DirectoryName 'NoSleep-win64.zip'
          Copy-Item $zip.FullName $stable -Force

          $notes = @(
            'Portable Windows build (x64).',
            '',
            'Download the zip, extract it anywhere, and run `NoSleep.exe`.',
            'Nothing is installed, nothing is written, and deleting the executable is a complete removal.',
            '',
            'If Windows says it protected your PC, the file arrived with a download mark. Clear it first:',
            '',
            '```powershell',
            'Unblock-File .\NoSleep.exe',
            '```',
            '',
            'Checksum:',
            '',
            '```',
            $checksum,
            '```'
          ) -join "`n"

          $notes | Set-Content -Path release-notes.md -Encoding UTF8
          gh release create $tag $stable --title "NoSleep $tag" --notes-file release-notes.md
